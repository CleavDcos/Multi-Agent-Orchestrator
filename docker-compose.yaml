services:

  backend:

    build:
      context: ./backend

    container_name: multi-agent-backend

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - redis

    volumes:
      - ./backend:/app

    restart: always



  frontend:

    build:
      context: ./frontend

    container_name: multi-agent-frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend

    volumes:
      - ./frontend:/app

    restart: always



  redis:

    image: redis:latest

    container_name: multi-agent-redis

    ports:
      - "6379:6379"

    restart: always